name: Build and publish to AUR

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aur-publish.yml
      - .gitignore
      - .SRCINFO
      - LICENSE
      - LICENSES/**
      - PKGBUILD
      - README.md
      - REUSE.toml
      - tests/**
      - WeGame-EULA.txt
      - wegame-dwproton
      - wegame-dwproton.desktop
      - wegame-dwproton.install
  pull_request:
    paths:
      - .github/workflows/aur-publish.yml
      - .SRCINFO
      - PKGBUILD
      - tests/**
      - wegame-dwproton
      - wegame-dwproton.desktop
      - wegame-dwproton.install
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aur-publish-wegame-dwproton-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:base-devel
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install build tools
        run: >-
          pacman -Syu --noconfirm --needed
          7zip desktop-file-utils git hicolor-icon-theme imagemagick namcap shellcheck

      - name: Create unprivileged package builder
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Validate integration files
        run: |
          bash -n wegame-dwproton tests/test-launch-lifecycle.sh tests/test-update-recovery.sh
          shellcheck wegame-dwproton tests/test-launch-lifecycle.sh tests/test-update-recovery.sh
          desktop-file-validate wegame-dwproton.desktop
          tests/test-launch-lifecycle.sh
          tests/test-update-recovery.sh
          diff -u .SRCINFO <(runuser -u builder -- makepkg --printsrcinfo)

      - name: Build package as an unprivileged user
        run: runuser -u builder -- makepkg --cleanbuild --force --syncdeps --noconfirm

      - name: Inspect package
        run: |
          namcap PKGBUILD ./*.pkg.tar.zst
          if bsdtar -tf ./*.pkg.tar.zst | grep -Eq '^(home|root)/'; then
            echo 'Package contains a per-user or root-home path.' >&2
            exit 1
          fi

  publish:
    name: Publish verified package recipe
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: wegame-dwproton
          pkgbuild: ./PKGBUILD
          assets: |
            .gitignore
            LICENSE
            README.md
            WeGame-EULA.txt
            wegame-dwproton
            wegame-dwproton.desktop
            wegame-dwproton.install
          post_process: git config core.filemode true && chmod 755 wegame-dwproton
          commit_username: ParticleG
          commit_email: particle_g@outlook.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Sync from GitHub: ${{ github.sha }}"
